# ---------------------------------------------------------------------------
# SGE - Integracao continua
#
# Tres jobs, propositalmente separados:
#
#   qualidade  - lint e verificacoes proprias. Segundos.
#   testes     - a suite em SQLite, como roda na maquina de quem desenvolve.
#   postgres   - a mesma suite contra PostgreSQL 16.
#
# O terceiro existe porque o desenvolvimento e 100% SQLite e os dois bancos
# discordam justamente no que da trabalho: `ALTER` que o Postgres recusa,
# transacao abortada apos erro, ordenacao com acento. Sem este job, a
# incompatibilidade so aparece no dia do deploy para a escola.
# ---------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Um push novo cancela a execucao anterior do mesmo branch: nao adianta
# esperar o resultado de um commit que ja foi substituido.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  qualidade:
    name: Lint e verificacoes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar ferramentas
        run: pip install ruff==0.7.4

      # Sem `ruff format --check`: adotar o formatador reescreveria 73 dos
      # 142 arquivos, e na matriz de permissoes o resultado e pior — ver o
      # comentario em .pre-commit-config.yaml.
      - name: ruff check
        run: ruff check .

      - name: Uploads fora de app/static/
        run: python scripts/verificar_uploads.py

      - name: Sem script inline nos templates
        run: python scripts/verificar_templates.py

  testes:
    name: Testes (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Rodar a suite
        run: pytest -q --cov=app --cov-report=term-missing

  postgres:
    name: Testes (PostgreSQL 16)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sge_teste
          POSTGRES_USER: sge
          POSTGRES_PASSWORD: sge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "psycopg[binary]==3.2.3"

      - name: Aplicar as migrations no PostgreSQL
        # Verifica o que a suite em SQLite nao verifica: que a sequencia
        # completa de migrations roda em Postgres, do zero ate a ultima.
        env:
          FLASK_APP: run.py
          SECRET_KEY: chave-apenas-para-ci-nao-usar-em-producao
          DATABASE_URL: postgresql+psycopg://sge:sge@localhost:5432/sge_teste
          FLASK_ENV: production
        run: |
          flask db upgrade
          flask db downgrade base
          flask db upgrade

  seguranca:
    name: Vulnerabilidades nas dependencias
    runs-on: ubuntu-latest
    # Informativo: um CVE publicado numa dependencia transitiva nao pode
    # travar a correcao de um bug de nota na sexta-feira. O alerta aparece,
    # a decisao de atualizar e humana.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar pip-audit
        run: pip install pip-audit==2.7.3

      - name: Auditar requirements
        run: pip-audit --requirement requirements.txt --strict
